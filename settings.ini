[Extensions]
excluded = .exe, .bin, .dll, .obj, .so, .dylib, .ico, .ini, .md, .txt, .jpg, .jpeg, .jfif, .gif, .webp, .avif, .png, .bmp, .svg, .tif, .tiff, .mp3, .wav, .ogg, .flac, .m4a, .mp4, .m4v, .mkv, .avi, .mov, .webm, .zip, .7z, .rar, .tar, .gz, .bz2, .xz, .db, .sqlite, .sqlite3, .pdf, .woff, .woff2, .ttf, .otf, .env

[Exclusions]
folders = __pycache__, build, .git, node_modules, dist
files = thumbs.db, desktop.ini, .gitignore, .env, license.txt
